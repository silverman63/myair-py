[tool.poetry]
name = "myair-py"
version = "0.1.1"
description = "API Client to interact with ResMed MyAir CPAP data"
authors = ["Alex Silverman <alex@silverswatch.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
PyJWT = "^2.8.0"
aiohttp = "^3.9.5"
beautifulsoup4 = "^4.12.3"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
